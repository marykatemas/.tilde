# ~/.config/lazygit/config.yml

# promptToReturnFromSubprocess: false

gui:
  theme:
    activeBorderColor:
      - green
      - bold
  showIcons: true
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
  commit:
    signOff: false
keybinding:
  universal:
    quit: "q"
    return: "<esc>"
